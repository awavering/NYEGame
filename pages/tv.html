<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Game TV</title>
<style>
  :root { --bg:#0e0c1d; --panel:#1b1735; --ink:#f4f1ff; --dim:#a9a3c9; --accent:#ffcc33; --good:#3ddc97; --bad:#ff6b81; --pink:#ff5fa2;
          --cw:260px; /* photo card width; set from the screen size in sizeCards() */ }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { background:radial-gradient(circle at 50% 0%, #26204d 0%, var(--bg) 60%); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #layout { display:grid; grid-template-columns:minmax(300px,24vw) 1fr minmax(320px,26vw); grid-template-rows:1fr auto; height:100vh; gap:16px; padding:16px; }
  .panel { background:rgba(27,23,53,.9); border-radius:24px; padding:20px; overflow:hidden; }
  h1 { margin:0 0 4px; font-size:clamp(22px,2.2vw,40px); }
  .label { text-transform:uppercase; letter-spacing:.14em; font-size:clamp(11px,.9vw,16px); color:var(--dim); font-weight:700; }
  .left { display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; }
  .left img { width:100%; max-width:340px; background:#fff; border-radius:18px; padding:8px; }
  .url { font-family:ui-monospace,Menlo,monospace; font-size:clamp(12px,1.1vw,20px); color:var(--accent); word-break:break-all; }
  .count { font-size:clamp(36px,4vw,72px); font-weight:900; line-height:1; }
  .clock { margin-top:auto; color:var(--ink); font-size:clamp(18px,1.8vw,34px); font-weight:800; }

  /* ---- bouncing photos (big enough to see from the couch) ---- */
  #stage { position:relative; overflow:hidden; border-radius:24px; border:2px dashed rgba(255,255,255,.08); }
  .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:clamp(18px,2vw,34px); text-align:center; padding:30px; }
  .bounce { position:absolute; left:0; top:0; width:var(--cw); background:#fff; border-radius:16px; padding:10px; color:#222; box-shadow:0 10px 30px rgba(0,0,0,.5); will-change:transform; }
  .bounce img { width:100%; height:calc(var(--cw) * .78); object-fit:cover; border-radius:10px; display:block; }
  .bounce .cap { padding-top:8px; line-height:1.15; }
  .bounce .cap b { display:block; font-size:calc(var(--cw) * .1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bounce .cap span { display:block; font-size:calc(var(--cw) * .06); color:#555; height:2.4em; overflow:hidden; }

  /* ---- right column ---- */
  .right { display:flex; flex-direction:column; gap:14px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:center; }
  .stat .n { font-size:clamp(34px,3.6vw,66px); font-weight:900; line-height:1; }
  .stat.good .n { color:var(--good); } .stat.pics .n { color:var(--accent); }
  .skipped { text-align:center; color:var(--dim); font-size:clamp(11px,.9vw,16px); }
  .cats { display:grid; gap:6px; font-size:clamp(13px,1.2vw,22px); }
  .cats b { color:var(--accent); }
  .board { list-style:none; margin:0; padding:0; font-size:clamp(15px,1.5vw,28px); }
  .board li { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .board li:first-child { color:var(--accent); font-weight:800; }

  /* ---- news-ticker feed along the bottom ---- */
  #feed { grid-column:1 / -1; overflow:hidden; height:54px; display:flex; align-items:center; font-size:clamp(14px,1.3vw,24px); }
  #feed .track { display:flex; gap:12px; width:max-content; animation:ticker var(--dur, 40s) linear infinite; }
  #feed span { background:rgba(27,23,53,.9); padding:10px 16px; border-radius:999px; white-space:nowrap; }
  /* The items are written out twice, so sliding left by half loops seamlessly. */
  @keyframes ticker { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  /* ---- full-screen overlays: poll, flash QR, icon match, countdown, finale ---- */
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,6,20,.9); z-index:20; padding:4vw; }
  #overlay.show { display:flex; }
  .big { text-align:center; max-width:1800px; width:100%; position:relative; z-index:2; }
  .big h2 { font-size:clamp(30px,4.6vw,84px); margin:0 0 20px; }
  .bar { display:flex; align-items:center; gap:16px; margin:10px 0; font-size:clamp(18px,2.4vw,40px); text-align:left; }
  .bar .name { width:28%; } .bar .track { flex:1; background:#2a2552; border-radius:12px; height:clamp(28px,3vw,54px); overflow:hidden; }
  .bar .fill { background:linear-gradient(90deg,var(--pink),var(--accent)); height:100%; transition:width .6s; } .bar .num { width:3ch; }
  .chip { display:inline-block; background:#2a2552; padding:8px 16px; border-radius:999px; margin:6px; font-size:clamp(16px,2vw,34px); }
  .chip i { color:var(--accent); font-style:normal; margin-left:8px; }
  .huge { font-size:clamp(60px,11vw,220px); font-weight:900; color:var(--accent); line-height:1; }
  .biglabel { font-size:clamp(16px,1.8vw,30px); color:var(--dim); margin-top:14px; }
  #flashqr { background:#fff; padding:14px; border-radius:20px; width:min(42vh,420px); }
  .meter { height:14px; background:#2a2552; border-radius:99px; margin:16px auto 0; width:min(60vw,600px); overflow:hidden; }
  .meter div { height:100%; background:var(--pink); transition:width 1s linear; }

  /* countdown: the last minute before midnight */
  .countdown { font-size:clamp(120px,30vw,560px); font-weight:900; line-height:1; color:var(--accent); text-shadow:0 0 60px rgba(255,204,51,.5); }
  .countdown.final { animation:pulse 1s ease-out infinite; }
  @keyframes pulse { from { transform:scale(1.25); } to { transform:scale(1); } }

  /* finale */
  .podium { display:flex; justify-content:center; flex-wrap:wrap; gap:20px; align-items:flex-end; margin-top:20px; }
  .podium div { background:#2a2552; border-radius:16px; padding:18px 26px; font-size:clamp(20px,2.6vw,44px); }
  .podium .gold { background:var(--accent); color:#222; font-weight:900; transform:scale(1.15); }
  /* scores on the left, photo slideshow on the right, half each */
  .finale-wrap { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:3vw; align-items:center; }
  .finale-wrap.nophotos { grid-template-columns:1fr; }
  .slide { background:#fff; padding:12px; border-radius:18px; color:#222; transform:rotate(2deg); box-shadow:0 20px 50px rgba(0,0,0,.6); }
  .slide img { width:100%; height:min(56vh,32vw); object-fit:cover; border-radius:10px; display:block; transition:opacity .5s; }
  .slide b { display:block; font-size:clamp(18px,2vw,34px); padding-top:8px; }

  /* confetti: plain CSS pieces that fall and spin (no libraries) */
  #confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:21; }
  #confetti i { position:absolute; top:-5vh; width:12px; height:22px; border-radius:3px; animation:fall linear infinite; }
  @keyframes fall { to { transform:translateY(112vh) rotate(720deg); } }

  /* a newly uploaded photo gets a few seconds full screen */
  #spotlight { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(8,6,20,.92); z-index:15; }
  #spotlight.show { display:flex; animation:pop .5s ease-out; }
  #spotlight .slide { transform:rotate(-1.5deg); max-width:70vw; }
  #spotlight img { height:68vh; width:auto; max-width:66vw; }
  #spotlight .label { margin-bottom:16px; font-size:clamp(16px,1.6vw,28px); color:var(--accent); }

  /* small join QR in the corner, so late arrivals can still join during a poll */
  #cornerjoin { position:fixed; left:2vw; bottom:2vw; z-index:30; display:none; background:#fff; color:#222; border-radius:16px; padding:10px; text-align:center; font-weight:800; font-size:clamp(12px,1vw,18px); }
  #cornerjoin img { width:clamp(110px,10vw,180px); display:block; }
  #cornerjoin.show { display:block; }

  .pop { animation:pop .6s ease-out; } @keyframes pop { from { opacity:0; scale:.3; } to { opacity:1; scale:1; } }
</style>
</head>
<body>
<div id="layout">
  <section class="panel left">
    <h1 id="title">Party Game</h1>
    <div class="label">Scan to play</div>
    <img id="qr" src="/qr/join.png" alt="Join QR code">
    <div class="url" id="joinurl"></div>
    <div><div class="count" id="players">0</div><div class="label">players</div></div>
    <div class="clock" id="clock"></div>
  </section>

  <section id="stage"><div class="empty" id="empty">Scan the QR code to join.<br>Photos you take will bounce around here.</div></section>

  <section class="panel right">
    <div class="stats">
      <div class="stat good"><div class="n" id="done">0</div><div class="label">Tasks completed</div></div>
      <div class="stat pics"><div class="n" id="pics">0</div><div class="label">Photos</div></div>
    </div>
    <div class="skipped" id="skipped"></div>
    <div class="cats" id="cats"></div>
    <div><div class="label">Leaderboard</div><ol class="board" id="board" style="padding-left:0"></ol></div>
  </section>

  <div id="feed"></div>
</div>
<div id="spotlight"></div>
<div id="overlay"><div class="big" id="overlaybody"></div></div>
<div id="confetti"></div>
<div id="cornerjoin"><img src="/qr/join.png" alt="">Scan to join</div>

<script>
/* ---------------------------------------------------------------
   TV page. Every 1.5 seconds it asks the server for everything
   (/api/tv) and redraws. On top of the normal scoreboard there are
   full-screen "moments": a spotlight on each new photo, polls,
   the flash QR, icon match, the midnight countdown and the finale.
   --------------------------------------------------------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- bouncing photo cards (DVD-logo style) ---------------- */
const stage = $('#stage');
const bouncers = new Map();     // photo id -> {el, x, y, vx, vy}
let cardW = 260;

// Photo cards scale with the screen: about a quarter of the middle area's
// width, so they are readable from across the room on a big TV.
function sizeCards() {
  cardW = Math.round(Math.max(200, Math.min(380, stage.clientWidth / 4)));
  document.documentElement.style.setProperty('--cw', cardW + 'px');
}
sizeCards();
window.addEventListener('resize', sizeCards);

let firstSync = true;
function syncPhotos(list) {
  const ids = new Set(list.map(p => p.id));
  for (const [id, b] of bouncers) if (!ids.has(id)) { b.el.remove(); bouncers.delete(id); }
  for (const p of list) if (!bouncers.has(p.id)) {
    addBouncer(p);
    if (!firstSync) queueSpotlight(p);   // don't replay old photos when the TV page first opens
  }
  firstSync = false;
  for (let i = spotQueue.length - 1; i >= 0; i--) if (!ids.has(spotQueue[i].id)) spotQueue.splice(i, 1);  // host hid it
  $('#empty').style.display = list.length ? 'none' : 'flex';
}
function addBouncer(p) {
  const el = document.createElement('div');
  el.className = 'bounce pop';
  el.innerHTML = `<img src="${esc(p.url)}" alt=""><div class="cap"><b>${esc(p.name)}</b><span>${esc(p.prompt)}</span></div>`;
  stage.appendChild(el);
  const W = stage.clientWidth, H = stage.clientHeight;
  const speed = 50 + Math.random() * 50, angle = Math.random() * Math.PI * 2;
  bouncers.set(p.id, { el, x: Math.random() * Math.max(1, W - cardW), y: Math.random() * Math.max(1, H - cardW * 1.15),
                       vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const W = stage.clientWidth, H = stage.clientHeight;
  for (const b of bouncers.values()) {
    const h = b.el.offsetHeight || cardW * 1.15;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx); }
    if (b.x > W - cardW) { b.x = Math.max(0, W - cardW); b.vx = -Math.abs(b.vx); }
    if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy); }
    if (b.y > H - h) { b.y = Math.max(0, H - h); b.vy = -Math.abs(b.vy); }
    b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- spotlight: a new photo gets 5 seconds full screen ----------------
   At most one every 15 seconds, so a busy party doesn't hide the scoreboard.
   If several photos arrive in between, only the newest is shown big (the rest
   still bounce around as normal). */
const spotQueue = [];
let spotBusy = false, spotEndedAt = 0;
const SPOT_GAP_MS = 15000;
function queueSpotlight(p) {
  spotQueue.length = 0;    // only keep the newest
  spotQueue.push(p);
  playSpotlight();
}
function playSpotlight() {
  // Wait while a poll, countdown or finale is on screen; tick() calls us again.
  if (spotBusy || !spotQueue.length || $('#overlay').classList.contains('show')) return;
  if (Date.now() - spotEndedAt < SPOT_GAP_MS) return;
  const p = spotQueue.shift();
  const el = $('#spotlight');
  spotBusy = true;
  el.innerHTML = `<div class="label">📸 New photo</div>
    <div class="slide"><img src="${esc(p.url)}" alt=""><b>${esc(p.name)}</b><span class="label" style="color:#555">${esc(p.prompt)}</span></div>`;
  el.classList.add('show');
  setTimeout(() => { el.classList.remove('show'); spotBusy = false; spotEndedAt = Date.now(); }, 5000);
}

/* ---------------- news-ticker feed ---------------- */
let lastFeed = '';
function drawFeed(feed) {
  const items = feed.map(f => {
    const verb = f.result === 'done' ? '✅ completed' : f.result === 'declined' ? '⏭️ skipped' : '⭐';
    return `<span><b>${esc(f.name)}</b> ${verb} ${esc(f.prompt)}</span>`;
  }).join('');
  if (items === lastFeed) return;     // rebuilding restarts the scroll, so only do it on news
  lastFeed = items;
  $('#feed').innerHTML = items ? `<div class="track">${items}${items}</div>` : '';
  const track = $('#feed .track');
  if (track) track.style.setProperty('--dur', Math.max(20, track.scrollWidth / 2 / 90) + 's');   // ~90 px per second
}

/* ---------------- full-screen overlays ---------------- */
function overlay(html) {
  const o = $('#overlay');
  if (!html) { o.classList.remove('show'); return; }
  o.classList.add('show'); $('#overlaybody').innerHTML = html;
}

function pollHtml(p) {
  let body = '';
  if (p.kind === 'choice') {
    const max = Math.max(1, ...Object.values(p.counts));
    body = p.options.map(o => `<div class="bar"><div class="name">${esc(o)}</div><div class="track"><div class="fill" style="width:${100 * p.counts[o] / max}%"></div></div><div class="num">${p.counts[o]}</div></div>`).join('');
  } else if (p.kind === 'number') {
    body = p.numbers.length
      ? `<div class="huge">${p.avg}</div><div class="label">average · low ${p.min} · high ${p.max}</div><div style="margin-top:14px">${p.numbers.map(n => `<span class="chip">${n}</span>`).join('')}</div>`
      : '';
  } else {
    body = p.words.map(([w, n]) => `<span class="chip">${esc(w)}${n > 1 ? `<i>×${n}</i>` : ''}</span>`).join('');
  }
  return `<h2>${esc(p.question)}</h2>${body}<p class="biglabel">${p.count} answer${p.count === 1 ? '' : 's'}${p.open ? ' · answer on your phone now!' : ' · final results'}</p>`;
}

/* Medals for the finale. Tied scores share a medal: two people on 35 points
   are both silver, and the next score down gets bronze. */
function podiumHtml(leaderboard) {
  const scores = [...new Set(leaderboard.map(p => p.points))];      // distinct scores, highest first
  const medals = ['🥇', '🥈', '🥉'];
  return leaderboard
    .map(p => ({ ...p, place: scores.indexOf(p.points) }))
    .filter(p => p.place < 3 && p.points > 0)
    .slice(0, 8)
    .map(p => `<div class="${p.place === 0 ? 'gold' : ''}">${medals[p.place]} ${esc(p.name)}<br>${p.points}</div>`)
    .join('');
}

function finaleHtml(d) {
  const thanks = d.finale_kind === 'thanks';
  const title = thanks ? '🎉 THANKS FOR PLAYING! 🎉' : '🎆 HAPPY NEW YEAR! 🎆';
  const hasPhotos = d.finale_photos.length > 0;
  return `<div class="finale-wrap ${hasPhotos ? '' : 'nophotos'}">
      <div><h2>${title}</h2><div class="label">Final scores</div>
        <div class="podium">${podiumHtml(d.leaderboard)}</div>
        <p class="biglabel">${d.players} players · ${d.completed} tasks completed · ${d.photo_total} photos</p></div>
      ${hasPhotos ? `<div class="slide"><img id="slideimg" alt=""><b id="slidename"></b></div>` : ''}
    </div>`;
}

/* Finale slideshow: a new photo from the night every 4 seconds. */
let slidePhotos = [], slideIndex = 0;
setInterval(() => {
  const img = $('#slideimg');
  if (!img || !slidePhotos.length) return;
  slideIndex = (slideIndex + 1) % slidePhotos.length;
  showSlide();
}, 4000);
function showSlide() {
  const img = $('#slideimg'), p = slidePhotos[slideIndex];
  if (!img || !p) return;
  img.src = p.url; $('#slidename').textContent = p.name;
}

/* Confetti on/off. The pieces are made once and then just animate. */
function confetti(on) {
  const box = $('#confetti');
  if (!on) { box.innerHTML = ''; return; }
  if (box.children.length) return;
  const colours = ['#ffcc33', '#ff5fa2', '#3ddc97', '#6ec3ff', '#ffffff', '#b28dff'];
  let html = '';
  for (let i = 0; i < 90; i++) {
    html += `<i style="left:${Math.random() * 100}vw; background:${colours[i % colours.length]};
      animation-duration:${3 + Math.random() * 4}s; animation-delay:${-Math.random() * 7}s;
      transform:rotate(${Math.random() * 360}deg)"></i>`;
  }
  box.innerHTML = html;
}

/* The last minute before midnight: a giant countdown. We remember when midnight
   is (in this TV's own clock) and redraw 4 times a second, so the numbers tick
   smoothly even though the server is only asked every 1.5 seconds. */
let midnightAt = null;       // Date.now() value of midnight
let showingFinale = false;
function countdownSeconds() {
  return midnightAt == null ? null : Math.ceil((midnightAt - Date.now()) / 1000);
}
setInterval(() => {
  const el = $('#cd');
  const s = countdownSeconds();
  if (!el || s == null) return;
  el.textContent = Math.max(0, s);
  el.classList.toggle('final', s <= 10);
}, 250);

/* Pick what goes full screen, most important first. Returns a short "key" so we
   only redraw when it actually changes (redrawing restarts animations). */
function chooseOverlay(d) {
  if (d.finale) return { key: 'finale' + d.finale_kind + JSON.stringify(d.leaderboard) + d.photo_total, html: finaleHtml(d), finale: true };
  const s = countdownSeconds();
  if (s != null && s <= 60 && s > -5) {
    return { key: 'countdown', html: `<div class="biglabel" style="font-size:clamp(24px,3vw,56px)">Midnight in</div><div class="countdown" id="cd">${Math.max(0, s)}</div>` };
  }
  if (d.flash) {
    const pct = Math.max(0, 100 * d.flash.remaining / (d.flash.total || 60));
    return { key: 'flash' + d.flash.remaining + d.flash.claimed, corner: true, html: `<h2>⚡ FLASH QR! +${d.flash.bonus} points ⚡</h2>
      <img id="flashqr" src="/qr/flash/${d.flash.token}.png" alt="">
      <div class="meter"><div style="width:${Math.min(100, pct)}%"></div></div>
      <p class="biglabel">${d.flash.remaining}s left · ${d.flash.claimed} grabbed it</p>` };
  }
  if (d.poll) { const html = pollHtml(d.poll); return { key: html, html, corner: true }; }
  if (d.icon) {
    const html = `<h2>🔍 Find your icon twin!</h2><div class="huge">${d.icon.found} / ${d.icon.total}</div><div class="biglabel">found each other</div>`;
    return { key: html, html, corner: true };
  }
  return { key: '', html: '' };
}

/* ---------------- main refresh ---------------- */
let lastOverlay = null;
async function tick() {
  let d;
  try { d = await (await fetch('/api/tv')).json(); } catch (e) { return; }

  midnightAt = Date.now() + d.seconds_to_midnight * 1000;

  $('#joinurl').textContent = d.join_url.replace(/^https?:\/\//, '');
  $('#players').textContent = d.players;
  $('#done').textContent = d.completed;
  $('#pics').textContent = d.photo_total;
  $('#skipped').textContent = d.declined ? `${d.declined} skipped` : '';

  const m = d.minutes_to_midnight;
  $('#clock').textContent = m > 0 ? '⏳ Midnight in ' + Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : '🎉 Happy New Year!';

  const cats = [];
  if (d.most_popular) cats.push(`Most popular: <b>${esc(d.most_popular.name)}</b> (${d.most_popular.done} done)`);
  if (d.least_popular) cats.push(`Most skipped: <b>${esc(d.least_popular.name)}</b> (${d.least_popular.declined} of ${d.least_popular.total})`);
  if (d.best_g) cats.push(`Top G-force: <b>${esc(d.best_g.name)}</b> (${d.best_g.g.toFixed(2)} g)`);
  $('#cats').innerHTML = cats.length ? cats.map(c => `<div>${c}</div>`).join('') : '<div class="label">Waiting for the first task...</div>';

  $('#board').innerHTML = d.leaderboard.map(p => `<li><span>${esc(p.name)}</span><span>${p.points}</span></li>`).join('') || '<li><span class="label">No players yet</span></li>';

  drawFeed(d.feed);
  syncPhotos(d.photos);

  const o = chooseOverlay(d);
  if (o.key !== lastOverlay) {
    lastOverlay = o.key;
    overlay(o.html);
    if (o.finale) { slidePhotos = d.finale_photos; slideIndex = 0; showSlide(); }
  }
  slidePhotos = d.finale_photos.length ? d.finale_photos : slidePhotos;
  confetti(!!o.finale);
  $('#cornerjoin').classList.toggle('show', !!o.corner);
  playSpotlight();   // in case one was waiting for an overlay to finish
}
fetch('/api/config').then(r => r.json()).then(c => { $('#title').textContent = c.party_name; document.title = c.party_name; });
